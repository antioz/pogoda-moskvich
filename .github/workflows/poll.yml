name: Слушатель новых чатов

on:
  schedule:
    - cron: "*/5 * * * *" # каждые ~5 минут (GitHub может задерживать)
  workflow_dispatch:

# Сериализуем с ежедневной рассылкой: оба пишут data/state.json.
concurrency:
  group: bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Опросить Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: node src/poll.js
      - name: Сохранить состояние
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "state: обновление списка чатов [skip ci]"
          git push
